name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASSWORD:-openfile_release_2026}" \
              -keypass "${KEY_PASSWORD:-openfile_release_2026}" \
              -dname "CN=OpenFile, OU=Mobile, O=OpenFile, L=Earth, S=Earth, C=US"
          fi

      # =========================================================================================
      # CRITICAL RELEASE SECURITY POLICY:
      # NEVER PUBLISH, DISTRIBUTE, OR ATTACH DEBUG APKS TO RELEASES!
      #
      # Debug APKs contain unoptimized bytecode, disabled R8 minification, debug symbols, and
      # insecure testing signatures. Public releases MUST strictly use signed production release
      # APKs (OpenFile-*-release.apk). Do NOT include app-debug.apk in release distribution assets.
      # =========================================================================================
      - name: Run Unit Tests & Assemble Production Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="${STORE_PASSWORD:-openfile_release_2026}"
          export KEY_PASSWORD="${KEY_PASSWORD:-openfile_release_2026}"
          ./gradlew :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" assembleRelease
          mkdir -p dist
          # Copy ONLY the signed, minified release APK for distribution
          cp app/build/outputs/apk/release/app-release.apk dist/OpenFile-v1.0.0-release.apk
          ls -lh dist/

      - name: Upload Release APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFile-Release-APK
          path: dist/*.apk
          if-no-files-found: error
